[package]
name = "blunderjack"
version = "0.1.1"
edition = "2024"
default-run = "blunderjack-client"

[lib]
name = "blunderjack"

[[bin]]
name = "blunderjack-client"
path = "src/bin/client.rs"

[[bin]]
name = "blunderjack-server"
path = "src/bin/server.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
